name: Build Packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            asset: CronBox-macos-aarch64.tar.gz
          - name: macOS x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: CronBox-macos-x86_64.tar.gz
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: CronBox-linux-x86_64.tar.gz
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: CronBox-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Build binary
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.asset }}" -C "src-tauri/target/${{ matrix.target }}/release" cronbox

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "src-tauri/target/${{ matrix.target }}/release/cronbox.exe" -DestinationPath "${{ matrix.asset }}"

      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload release asset
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: ${{ matrix.asset }}
