<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="c2-title">
  <title id="c2-title">CronBox Logo</title>
  <defs>
    <linearGradient id="c2g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <!-- Outer rounded square -->
  <rect x="8" y="8" width="104" height="104" rx="20" fill="none" stroke="url(#c2g)" stroke-width="4"/>
  <!-- Cron-style cycle: three arrows forming a triangle loop -->
  <g fill="none" stroke="url(#c2g)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top arc -->
    <path d="M60,28 L82,50"/>
    <polygon points="82,50 74,44 78,53" fill="url(#c2g)" stroke="none"/>
    <!-- Right to bottom-left -->
    <path d="M82,54 L60,82"/>
    <polygon points="60,82 66,74 57,76" fill="url(#c2g)" stroke="none"/>
    <!-- Bottom-left to top -->
    <path d="M56,80 L38,50"/>
    <polygon points="38,50 40,60 46,52" fill="url(#c2g)" stroke="none"/>
    <!-- Left to top -->
    <path d="M40,46 L56,28"/>
    <polygon points="56,28 48,34 54,38" fill="url(#c2g)" stroke="none"/>
  </g>
  <!-- Center: small box icon -->
  <rect x="48" y="43" width="24" height="24" rx="5" fill="url(#c2g)"/>
  <line x1="54" y1="50" x2="66" y2="50" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="54" y1="56" x2="62" y2="56" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Bottom label -->
  <text x="60" y="110" font-family="'SF Mono','Menlo',monospace" font-size="11" font-weight="600" fill="#6366F1" text-anchor="middle" opacity="0.8">cron</text>
</svg>